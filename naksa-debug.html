<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Naksa Analyzer — Internal Test Harness</title>
<style>
    body{font-family:'Segoe UI',Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;background:#0C1C2A;color:#e7edf3}
    h1{font-size:1.3rem}
    p.note{color:#93a4b3;font-size:13px}
    .test-summary{font-weight:700;font-size:1.1rem;padding:12px 16px;border-radius:8px;margin-bottom:16px}
    .test-summary.all-pass{background:rgba(30,180,110,0.15);color:#3ddc97}
    .test-summary.has-failures{background:rgba(220,38,38,0.15);color:#ff6b6b}
    .test-list{list-style:none;padding:0;margin:0}
    .test-list li{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:13.5px}
    .test-list li.pass .test-icon{color:#3ddc97}
    .test-list li.fail .test-icon{color:#ff6b6b}
    .test-icon{display:inline-block;width:20px;font-weight:700}
    .test-error{margin:6px 0 0 20px;color:#ffb4b4;font-size:12.5px}
</style>
</head>
<body>
    <h1>Naksa Analyzer — Pure Module Test Harness</h1>
    <p class="note">Exercises geometry.js, units.js and calibration.js directly, with no build step — open this page over HTTP (not file://) after any change to those modules. Not linked from site navigation or the sitemap.</p>
    <div id="results">Running tests…</div>
    <script type="module">
        import { runAll } from './src/js/naksa/test/run-tests.js';
        runAll(document.getElementById('results'));
    </script>
</body>
</html>
